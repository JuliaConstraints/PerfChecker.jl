name: Trigger JuliaConstraints site rebuild

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger JuliaConstraints.github.io
        env:
          GH_TOKEN: ${{ secrets.JULIACONSTRAINTS_DOCS_TOKEN }}
          PACKAGE_REPOSITORY: ${{ github.repository }}
          PACKAGE_REF: ${{ github.ref }}
          PACKAGE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing JULIACONSTRAINTS_DOCS_TOKEN secret."
            echo "Create a token with permission to dispatch workflows in JuliaConstraints/JuliaConstraints.github.io."
            exit 1
          fi

          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/JuliaConstraints/JuliaConstraints.github.io/dispatches \
            -d @- <<EOF
          {
            "event_type": "package-release",
            "client_payload": {
              "package": "PerfChecker",
              "repository": "${PACKAGE_REPOSITORY}",
              "ref": "${PACKAGE_REF}",
              "sha": "${PACKAGE_SHA}",
              "tag": "${RELEASE_TAG}",
              "release_url": "${RELEASE_URL}"
            }
          }
          EOF
